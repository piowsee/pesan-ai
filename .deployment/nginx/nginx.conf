# =========================================================
# 1. TCP PROXY (Database Connections)
# =========================================================
stream {
    # Direct PostgreSQL Connection
    server {
        listen 5432;
        # Use your database container name if using docker network, 
        # or VPS IP/localhost if running differently
        proxy_pass 127.0.0.1:5432;
    }

    # PgBouncer Connection Pooler
    server {
        listen 6432;
        proxy_pass 127.0.0.1:6432;
    }
}

# =========================================================
# 2. HTTP / HTTPS PROXY (Web App)
# =========================================================
http {
    # --- HTTP (Port 80) ---
    server {
        listen 80;
        server_name <your-server-ip-or-domain>;
        
        # uncomment this to force redirect to HTTPS
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }

    # --- HTTPS (Port 443) ---
    server {
        listen 443 ssl;
        server_name <your-server-ip-or-domain>;

        ssl_certificate     /etc/ssl/certs/your_domain.crt;
        ssl_certificate_key /etc/ssl/private/your_domain.key;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
