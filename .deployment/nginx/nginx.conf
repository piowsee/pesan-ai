# =========================================================
# 1. TCP PROXY (Database Connections)
# =========================================================
stream {
    # Direct PostgreSQL Connection
    server {
        listen 5432;
        # Use your database container name if using docker network, 
        # or VPS IP/localhost if running differently
        proxy_pass 127.0.0.1:5432;
    }

    # PgBouncer Connection Pooler
    server {
        listen 6432;
        proxy_pass 127.0.0.1:6432;
    }
}

# =========================================================
# 2. HTTP / HTTPS PROXY (Web App)
# =========================================================
http {
    # --- HTTP (Port 80) ---
    server {
        listen 80;
        server_name YOUR_DOMAIN_NAME;
        
        # Force redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # --- HTTPS (Port 443) ---
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN_NAME;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_NAME/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
