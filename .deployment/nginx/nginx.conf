events {
    worker_connections 1024;
}

# =========================================================
# 1. TCP PROXY (Database Connections)
# =========================================================
stream {
    # Direct PostgreSQL Connection
    server {
        listen 5432;
        proxy_pass postgres:5432;
    }

    # PgBouncer Connection Pooler
    server {
        listen 6432;
        proxy_pass pgbouncer:6432;
    }
}

# =========================================================
# 2. HTTP / HTTPS PROXY (Web App)
# =========================================================
http {
    # --- HTTP (Port 80) ---
    server {
        listen 80;
        listen [::]:80; # IPv6 support
        server_name YOUR_DOMAIN_NAME;
        
        # Force redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # --- HTTPS (Port 443) ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl; # IPv6 support
        server_name YOUR_DOMAIN_NAME;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_NAME/privkey.pem;

        location / {
            # --- Cloudflare Real IP ---
            # Automatically extract real client IP from Cloudflare
            real_ip_header CF-Connecting-IP;
            # Cloudflare IPv4
            set_real_ip_from 173.245.48.0/20;
            set_real_ip_from 103.21.244.0/22;
            set_real_ip_from 103.22.200.0/22;
            set_real_ip_from 103.31.4.0/22;
            set_real_ip_from 141.101.64.0/18;
            set_real_ip_from 108.162.192.0/18;
            set_real_ip_from 190.93.240.0/20;
            set_real_ip_from 188.114.96.0/20;
            set_real_ip_from 197.234.240.0/22;
            set_real_ip_from 198.41.128.0/17;
            set_real_ip_from 162.158.0.0/15;
            set_real_ip_from 104.16.0.0/13;
            set_real_ip_from 104.24.0.0/14;
            set_real_ip_from 172.64.0.0/13;
            set_real_ip_from 131.0.72.0/22;
            # Cloudflare IPv6
            set_real_ip_from 2400:cb00::/32;
            set_real_ip_from 2606:4700::/32;
            set_real_ip_from 2803:f800::/32;
            set_real_ip_from 2405:b500::/32;
            set_real_ip_from 2405:8100::/32;
            set_real_ip_from 2a06:98c0::/29;
            set_real_ip_from 2c0f:f248::/32;

            proxy_pass http://pesanai_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
