services:
  pgbackrest:
    image: woblerr/pgbackrest:2.59.0
    container_name: pgbackrest
    # Run a dummy command so the container stays alive in the background.
    # This allows you to exec into it for manual backups/restores, or attach a cron job.
    # IMPORTANT: If this is the first time running pgBackRest for a new database,
    # you MUST initialize the stanza manually before any backups can run:
    # docker exec -it pgbackrest pgbackrest --stanza=YOUR_STANZA stanza-create
    command: ['tail', '-f', '/dev/null']
    labels:
      ofelia.enabled: 'true'
      # Run a FULL backup every Monday at 2:00 AM
      ofelia.job-exec.pgbackrest-full.schedule: '0 0 2 * * 1'
      ofelia.job-exec.pgbackrest-full.command: 'pgbackrest --stanza=YOUR_STANZA backup --type=full'

      # Run an INCREMENTAL backup Tue-Sun at 2:00 AM
      ofelia.job-exec.pgbackrest-incr.schedule: '0 0 2 * * 0,2-6'
      ofelia.job-exec.pgbackrest-incr.command: 'pgbackrest --stanza=YOUR_STANZA backup --type=incr'
    volumes:
      # We mount the shared volume so pgBackRest has direct access to Postgres data files
      - pesanai_database_volume:/var/lib/postgresql
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    networks:
      - backend

  # Ofelia is a Docker-native job scheduler.
  # It reads the labels above and executes the commands inside the pgbackrest container.
  cron:
    image: mcuadros/ofelia:latest
    container_name: pgbackrest_cron
    depends_on:
      - pgbackrest
    command: daemon --docker
    volumes:
      # Allows Ofelia to send `docker exec` commands to the other containers
      - /var/run/docker.sock:/var/run/docker.sock:ro

# We reference the network and volume that are created by the main database docker-compose.yaml
networks:
  backend:
    name: pesanai_backend
    external: true

volumes:
  pesanai_database_volume:
    name: pesanai_volume
    external: true
