events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        # Only accept traffic arriving over the WireGuard tunnel from the app host.
        # Docker publishes this server on the WireGuard interface only (see docker-compose),
        # and the WireGuard peer's source IP is preserved here.
        allow YOUR_APP_WG_IP;
        deny all;

        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;

            # n8n specific headers
            chunked_transfer_encoding off;
        }
    }
}
