---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: yes
  become: yes

- name: Determine this host's WireGuard role
  ansible.builtin.set_fact:
    wg_role: '{{ (group_names | intersect(wg_ips.keys() | list)) | first }}'

- name: Set this host's WireGuard address
  ansible.builtin.set_fact:
    wg_self_ip: '{{ wg_ips[wg_role] }}'

- name: Generate WireGuard private key
  ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/privatekey
  args:
    creates: /etc/wireguard/privatekey
  become: yes

- name: Derive WireGuard public key
  ansible.builtin.shell: wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey
  args:
    creates: /etc/wireguard/publickey
  become: yes

- name: Read WireGuard keys
  ansible.builtin.slurp:
    src: '/etc/wireguard/{{ item }}'
  loop:
    - privatekey
    - publickey
  register: wg_keys
  become: yes
  no_log: true

- name: Store WireGuard keys as facts
  ansible.builtin.set_fact:
    wg_private_key: '{{ wg_keys.results[0].content | b64decode | trim }}'
    wg_public_key: '{{ wg_keys.results[1].content | b64decode | trim }}'
  no_log: true

- name: Deploy wg0 interface config
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/wg0.conf.j2'
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  become: yes

- name: Enable and (re)start WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: yes
    state: restarted
    daemon_reload: yes
  become: yes
