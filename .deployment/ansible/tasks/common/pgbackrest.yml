---
- name: Ensure pgbackrest directory exists
  ansible.builtin.file:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest'
    state: directory
    mode: '0755'

- name: Copy pgbackrest docker-compose
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../pgbackrest/docker-compose.yaml'
    dest: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/docker-compose.yaml'
    mode: '0644'

- name: Copy pgbackrest.conf
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../pgbackrest/pgbackrest.conf'
    dest: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    mode: '0644'

- name: Configure pgbackrest.conf - s3 bucket
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-s3-bucket=.*'
    line: 'repo1-s3-bucket={{ s3_bucket }}'

- name: Configure pgbackrest.conf - s3 endpoint
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-s3-endpoint=.*'
    line: 'repo1-s3-endpoint={{ s3_endpoint }}'

- name: Configure pgbackrest.conf - s3 region
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-s3-region=.*'
    line: 'repo1-s3-region={{ s3_region }}'

- name: Configure pgbackrest.conf - s3 access key
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-s3-key=.*'
    line: 'repo1-s3-key={{ s3_access_key }}'

- name: Configure pgbackrest.conf - s3 secret key
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-s3-key-secret=.*'
    line: 'repo1-s3-key-secret={{ s3_secret_key }}'

- name: Configure pgbackrest.conf - cipher pass
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-cipher-pass=.*'
    line: 'repo1-cipher-pass={{ pgbackrest_cipher_pass }}'

- name: Configure pgbackrest.conf - cipher type
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-cipher-type=.*'
    line: 'repo1-cipher-type={{ pgbackrest_cipher_type }}'

- name: Configure pgbackrest.conf - repo type
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-type=.*'
    line: 'repo1-type={{ pgbackrest_repo_type }}'

- name: Configure pgbackrest.conf - retention full
  ansible.builtin.lineinfile:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '^repo1-retention-full=.*'
    line: 'repo1-retention-full={{ pgbackrest_retention_full }}'

- name: Configure pgbackrest stanza in config
  ansible.builtin.replace:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/pgbackrest.conf'
    regexp: '\[YOUR_STANZA\]'
    replace: '[{{ pgbackrest_stanza }}]'

- name: Configure pgbackrest stanza in docker-compose
  ansible.builtin.replace:
    path: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest/docker-compose.yaml'
    regexp: '--stanza=YOUR_STANZA'
    replace: '--stanza={{ pgbackrest_stanza }}'

- name: Start pgbackrest service
  ansible.builtin.command: docker compose up -d
  args:
    chdir: '{{ ansible_facts.env.HOME }}/pesanai-docker/pgbackrest'
  become: yes
