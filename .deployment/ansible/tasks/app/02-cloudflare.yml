---
- name: Fetch Cloudflare IPv4
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    return_content: yes
  register: cf_ipv4

- name: Fetch Cloudflare IPv6
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v6
    return_content: yes
  register: cf_ipv6

- name: Create Cloudflare Nginx config
  ansible.builtin.copy:
    dest: '~/pesanai-docker/nginx-app/cloudflare-allow.conf'
    mode: '0644'
    content: |
      geo $realip_remote_addr $cloudflare_ip {
          default 0;
      {% for ip in (cf_ipv4.content + '\n' + cf_ipv6.content).split('\n') %}
      {% if ip | trim != '' %}
          {{ ip }} 1;
      {% endif %}
      {% endfor %}
      }
      real_ip_header CF-Connecting-IP;
      {% for ip in (cf_ipv4.content + '\n' + cf_ipv6.content).split('\n') %}
      {% if ip | trim != '' %}
      set_real_ip_from {{ ip }};
      {% endif %}
      {% endfor %}
