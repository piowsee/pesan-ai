---
- name: Ensure deployment directories exist
  ansible.builtin.file:
    path: '~/pesanai-docker/{{ item }}'
    state: directory
    mode: '0755'
  loop:
    - n8n

- name: Copy n8n files
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../n8n/'
    dest: '~/pesanai-docker/n8n/'
    mode: '0644'

- name: Inject App WireGuard IP into Nginx allow rule
  ansible.builtin.replace:
    path: '~/pesanai-docker/n8n/nginx.conf'
    regexp: 'YOUR_APP_WG_IP'
    replace: "{{ wg_ips['app'] }}"

- name: Bind n8n Nginx to the WireGuard interface
  ansible.builtin.replace:
    path: '~/pesanai-docker/n8n/docker-compose.yaml'
    regexp: 'YOUR_N8N_WG_IP'
    replace: "{{ wg_ips['n8n'] }}"
