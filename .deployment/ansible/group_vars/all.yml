---
# =========================================================
# WireGuard tunnel between the app and n8n hosts
# =========================================================
# The tunnel encrypts all app <-> n8n traffic at the network
# layer, so no domain / TLS certificate is needed between them.
wg_port: 51820
wg_network_cidr: 24
wg_ips:
  app: 10.10.10.1
  n8n: 10.10.10.2
