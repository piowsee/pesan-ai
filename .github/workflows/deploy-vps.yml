name: Deploy to VPS

on:
  workflow_run:
    workflows: ['Build & Push App Docker Image']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure directories exist on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            mkdir -p ~/pesanai-docker/app
            mkdir -p ~/pesanai-docker/database

      - name: Copy App docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          source: '.docker/app/docker-compose.yaml'
          target: '~/pesanai-docker/app/'
          strip_components: 2

      - name: Copy DB docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          source: '.docker/database/docker-compose.yaml'
          target: '~/pesanai-docker/database/'
          strip_components: 2

      - name: Start Database and Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            echo "==================================="
            echo "       DATABASE DEPLOYMENT         "
            echo "==================================="
            cd ~/pesanai-docker/database

            # Check if there are any running containers in this compose stack
            if [ -n "$(docker compose ps -q)" ]; then
              echo "Database is already running. Skipping startup."
            else
              echo "Database is not running. Starting it up..."
              docker compose pull
              docker compose up -d
            fi

            echo "==================================="
            echo "         APP DEPLOYMENT            "
            echo "==================================="
            cd ~/pesanai-docker/app

            echo "Shutting down old app containers..."
            docker compose down

            echo "Pulling latest image and starting app..."
            docker compose pull
            docker compose up -d
