name: Deploy App to VPS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Secrets
        run: |
          if [ -z "${{ secrets.PGBACKREST_CIPHER_TYPE }}" ] || [ -z "${{ secrets.PGBACKREST_CIPHER_PASS }}" ]; then
            echo "Error: pgBackRest encryption secrets (CIPHER_TYPE or CIPHER_PASS) are missing!"
            exit 1
          fi
          if [ -z "${{ secrets.PGBACKREST_S3_ACCESS_KEY }}" ] || [ -z "${{ secrets.PGBACKREST_S3_SECRET_KEY }}" ]; then
            echo "Error: S3 Access/Secret keys are missing!"
            exit 1
          fi
          if [ -z "${{ secrets.PGBACKREST_S3_BUCKET }}" ] || [ -z "${{ secrets.PGBACKREST_S3_ENDPOINT }}" ] || [ -z "${{ secrets.PGBACKREST_S3_REGION }}" ]; then
            echo "Error: S3 Bucket, Endpoint, or Region secrets are missing!"
            exit 1
          fi

      - name: Add SSH Keys with Passphrase
        env:
          # App Server Credentials (Server Hosted Together With DB and Reverse Proxy)
          SSH_KEY_APP: ${{ secrets.SSH_KEY_APP }}
          SSH_PASSPHRASE_APP: ${{ secrets.SSH_KEY_PASSPHRASE_APP }}
          # N8N Server Credentials
          SSH_KEY_N8N: ${{ secrets.SSH_KEY_N8N }}
          SSH_PASSPHRASE_N8N: ${{ secrets.SSH_KEY_PASSPHRASE_N8N }}
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          eval $(ssh-agent -s)

          # Helper function to add a key if it exists
          add_key() {
            local key="$1"
            local pass="$2"
            if [ -n "$key" ]; then
              echo "$key" > key.pem
              chmod 600 key.pem
              expect -c "
                spawn ssh-add key.pem
                expect \"Enter passphrase\"
                send \"$pass\r\"
                expect eof
              "
              rm key.pem
            fi
          }

          # Load both keys into the ssh-agent
          add_key "$SSH_KEY_APP" "$SSH_PASSPHRASE_APP"
          add_key "$SSH_KEY_N8N" "$SSH_PASSPHRASE_N8N"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        with:
          playbook: deploy.yml
          directory: .deployment/ansible
          # Note: We intentionally omit the 'key' input here.
          # Providing it would force Ansible to bypass the ssh-agent we set up in the previous step
          # and fail when prompted for the passphrase.
          inventory: |
            [app]
            ${{ secrets.SSH_HOST_APP }}

            [app:vars]
            ansible_port=${{ secrets.SSH_PORT_APP }}
            ansible_user=${{ secrets.SSH_USERNAME_APP }}
            ansible_become_password=${{ secrets.SUDO_PASSWORD_APP }}
            domain_name=${{ secrets.DOMAIN_NAME }}
            ssl_email=${{ secrets.SSL_EMAIL }}
            cf_api_token=${{ secrets.CF_API_TOKEN }}
            s3_bucket=${{ secrets.PGBACKREST_S3_BUCKET }}
            s3_endpoint=${{ secrets.PGBACKREST_S3_ENDPOINT }}
            s3_region=${{ secrets.PGBACKREST_S3_REGION }}
            s3_access_key=${{ secrets.PGBACKREST_S3_ACCESS_KEY }}
            s3_secret_key=${{ secrets.PGBACKREST_S3_SECRET_KEY }}
            pgbackrest_cipher_pass=${{ secrets.PGBACKREST_CIPHER_PASS }}
            pgbackrest_cipher_type=${{ secrets.PGBACKREST_CIPHER_TYPE }}
            pgbackrest_retention_full=${{ secrets.PGBACKREST_RETENTION_FULL }}
            pgbackrest_stanza=${{ secrets.PGBACKREST_STANZA }}

            [n8n]
            ${{ secrets.SSH_HOST_N8N }}

            [n8n:vars]
            ansible_port=${{ secrets.SSH_PORT_N8N }}
            ansible_user=${{ secrets.SSH_USERNAME_N8N }}
            ansible_become_password=${{ secrets.SUDO_PASSWORD_N8N }}
