name: Deploy App to VPS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add SSH Keys with Passphrase
        env:
          # App Server Credentials (Server Hosted Together With DB and Reverse Proxy)
          SSH_KEY_APP: ${{ secrets.SSH_KEY_APP }}
          SSH_PASSPHRASE_APP: ${{ secrets.SSH_KEY_PASSPHRASE_APP }}
          # N8N Server Credentials
          SSH_KEY_N8N: ${{ secrets.SSH_KEY_N8N }}
          SSH_PASSPHRASE_N8N: ${{ secrets.SSH_KEY_PASSPHRASE_N8N }}
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          eval $(ssh-agent -s)

          # Helper function to add a key if it exists
          add_key() {
            local key="$1"
            local pass="$2"
            if [ -n "$key" ]; then
              echo "$key" > key.pem
              chmod 600 key.pem
              expect -c "
                spawn ssh-add key.pem
                expect \"Enter passphrase\"
                send \"$pass\r\"
                expect eof
              "
              rm key.pem
            fi
          }

          # Load both keys into the ssh-agent
          add_key "$SSH_KEY_APP" "$SSH_PASSPHRASE_APP"
          add_key "$SSH_KEY_N8N" "$SSH_PASSPHRASE_N8N"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v9
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        with:
          playbook: deploy.yml
          directory: .deployment/ansible
          # Note: We intentionally omit the 'key' input here.
          # Providing it would force Ansible to bypass the ssh-agent we set up in the previous step
          # and fail when prompted for the passphrase.
          inventory: |
            [app]
            ${{ secrets.SSH_HOST_APP }} ansible_user=${{ secrets.SSH_USERNAME_APP }} ansible_become_password=${{ secrets.SUDO_PASSWORD_APP }} domain_name=${{ secrets.DOMAIN_NAME }} ssl_email=${{ secrets.SSL_EMAIL }} cf_api_token=${{ secrets.CF_API_TOKEN }}

            [n8n]
            ${{ secrets.SSH_HOST_N8N }} ansible_user=${{ secrets.SSH_USERNAME_N8N }} ansible_become_password=${{ secrets.SUDO_PASSWORD_N8N }}
