name: Build & Push App Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get version from package.json
        id: package_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract App image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/pesanai
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.package_version.outputs.VERSION }}

      - name: Build and push App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deployment/app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_META_APP_ID=${{ secrets.NEXT_PUBLIC_META_APP_ID }}
            NEXT_PUBLIC_FACEBOOK_CONFIG_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_CONFIG_ID }}

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit
